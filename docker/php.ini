expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Mantener en sintonia con client_max_body_size de nginx.conf
upload_max_filesize = 25M
post_max_size = 25M

; Esto garantiza que las variables que Dokploy inyecta en el contenedor pueblen
; $_ENV; de lo contrario settings.php caeria al fallback "sqlite::memory:".
; (Funciona junto a clear_env=no del pool de PHP-FPM.)
variables_order = "EGPCS"

; --- OPcache (produccion) ---
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=0 da el maximo rendimiento: PHP no revisa si los
; ficheros cambiaron. Es seguro aqui porque Dokploy reconstruye la imagen en
; cada deploy, asi que el cache siempre arranca limpio con el codigo nuevo.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
