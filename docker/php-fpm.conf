[www]
user  = www-data
group = www-data
listen = 127.0.0.1:9000

; Gestion dinamica de procesos. Subir estos valores en servidores con mas RAM.
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; CLAVE para Dokploy: por defecto PHP-FPM limpia el entorno.
; Con clear_env=no las variables inyectadas por Dokploy llegan a getenv()/$_ENV.
clear_env = no

; Redirige la salida de los workers a los logs del contenedor (stdout/stderr),
; que es donde Dokploy los lee.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
